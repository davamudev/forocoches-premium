name: Release

# On every push to master: if package.json has a version without a tag yet,
# build it and publish a GitHub release with the userscript and its CHANGELOG notes.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already released, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Check and build
        if: steps.version.outputs.exists != 'true'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Release notes from CHANGELOG
        if: steps.version.outputs.exists != 'true'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || $0 ~ /^\[[0-9.]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/forocoches-premium.user.js \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
